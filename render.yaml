services:
  - type: web
    name: hoja-de-vida
    env: python
    region: oregon
    plan: free
    disks:
      - name: media
        mountPath: /var/data/media
        sizeGB: 1
    buildCommand: >
      pip install -r requirements.txt &&
      cd mi_proyecto &&
      python check_db.py &&
      python manage.py migrate --noinput --verbosity 3 &&
      python manage.py create_admin &&
      python manage.py collectstatic --noinput
    startCommand: bash -lc "cd mi_proyecto && python check_db.py && python manage.py migrate --noinput --verbosity 3 && python manage.py create_admin && gunicorn app:app --workers 1 --timeout 60"
    envVars:
      - key: DEBUG
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: ALLOWED_HOSTS
        scope: runtime
        value: ${RENDER_EXTERNAL_URL}
      - key: SECRET_KEY
        scope: runtime
        value: ${SECRET_KEY}
      - key: DATABASE_URL
        fromDatabase:
          name: hoja-de-vida-db
          property: connectionString

  - type: pserv
    name: hoja-de-vida-db
    env: postgres
    region: oregon
    plan: free
    ipAllowList: []
